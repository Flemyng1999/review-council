name: thesis_undergrad_review
case_type: thesis_undergrad
description: |
  Layered review for an undergraduate thesis or capstone.
  Canonical ingestion: source -> frozen/manuscript.pdf -> MinerU -> normalized/manuscript.md.
  Philosophy: review = judging what the paper should become, not problem mining.
  paper_shape (gestalt) anchors all downstream critique; claim extraction is
  front-loaded so chapter/section reviews ground their findings in the
  author's stated claims.

stages:
- id: ensure_frozen_pdf
  description: Ensure frozen/manuscript.pdf exists. DOCX must be exported to PDF from Word; native PDF is copied to frozen/.
  produces: [frozen/manuscript.pdf]
  gate: human
  instruction: |
    For DOCX source: open in Microsoft Word and export to PDF, then save as frozen/manuscript.pdf.
    For native PDF source: copy or symlink source/<file>.pdf to frozen/manuscript.pdf.

- id: mineru_extract
  description: Run MinerU on frozen/manuscript.pdf to produce normalized Markdown and assets.
  needs: [frozen/manuscript.pdf]
  produces: [normalized/manuscript.md]
  gate: human
  instruction: |
    On the Linux GPU host (ubuntu-303):
      bash scripts/mineru_case_extract.sh cases/<case-id>/frozen/manuscript.pdf cases/<case-id>

- id: ensure_provenance
  description: Fallback line-based source map if MinerU did not write provenance/source_map.jsonl.
  needs: [normalized/manuscript.md]
  produces: [provenance/source_map.jsonl]
  command: index-markdown
  positional: [normalized/manuscript.md, provenance/source_map.jsonl]

- id: build_units
  description: Build hierarchical review units (macro / chapters / sections) and units/risk.json.
  needs: [normalized/manuscript.md]
  produces: [units/index.md]
  command: build-units
  positional: [normalized/manuscript.md, units]

- id: paper_shape
  description: Forced gestalt judgment — best version, current shape, top three transformation actions. Anchors all downstream critique.
  needs: [units/macro/whole.md]
  produces: [reviews/paper_shape.md]
  command: paper-shape
  positional: [units/macro/whole.md, reviews/paper_shape.md]
  flags: ["--case-id={case_id}", "--case-type={case_type}"]

- id: deepseek_macro
  description: Whole-manuscript layered review.
  needs: [units/macro/whole.md]
  produces: [reviews/deepseek/macro/whole.json]
  command: deepseek-review-unit
  positional: [units/macro/whole.md, reviews/deepseek/macro/whole.json]
  flags: ["--case-id={case_id}", "--case-type={case_type}", "--layer=macro", "--unit-id=whole"]

- id: extract_claims_draft
  description: DeepSeek-extract author claims from the macro unit. Front-loaded so chapter/section reviews can target specific claims.
  needs: [units/macro/whole.md]
  produces: [evidence/claims_draft.json]
  command: extract-claims
  positional: [units/macro/whole.md, evidence/claims_draft.json]
  flags: ["--case-id={case_id}", "--case-type={case_type}", "--unit-id=whole"]

- id: deepseek_chapters
  description: Per-chapter layered review (fanout). Grounded in evidence/claims_draft.json.
  fanout_pattern: units/chapters/chapter_*.md
  produces_template: reviews/deepseek/chapters/{stem}.json
  command: deepseek-review-unit
  positional_template: ["{unit}", "{output}"]
  flags_template: ["--case-id={case_id}", "--case-type={case_type}", "--layer=chapter", "--unit-id={stem}", "--claims=evidence/claims_draft.json"]

- id: deepseek_sections
  description: Per-section local review (fanout). Filtered by units/risk.json; grounded in claims_draft.
  fanout_pattern: units/sections/section_*.md
  risk_threshold: 30.0
  risk_table: units/risk.json
  produces_template: reviews/deepseek/sections/{stem}.json
  command: deepseek-review-unit
  positional_template: ["{unit}", "{output}"]
  flags_template: ["--case-id={case_id}", "--case-type={case_type}", "--layer=section", "--unit-id={stem}", "--claims=evidence/claims_draft.json"]

- id: aggregate
  description: Aggregate per-unit reviews into reviews/issue_graph.json.
  needs: [reviews/deepseek]
  produces: [reviews/issue_graph.json]
  command: aggregate-issue-graph
  positional: [reviews/deepseek, reviews/issue_graph.json]
  flags: ["--case-id={case_id}"]

- id: claim_matrix_review
  description: Human refines evidence/claims_draft.json into evidence/claim_evidence_matrix.json.
  needs: [evidence/claims_draft.json]
  produces: [evidence/claim_evidence_matrix.json]
  gate: human
  instruction: Edit evidence/claim_evidence_matrix.json from the draft. Add CLM ids, fix anchors, classify claim types, label evidence strength. Drop spurious or redundant entries.

- id: link_issues_to_claims
  description: Heuristically link reviews/issue_graph.json issues to evidence/claim_evidence_matrix.json claims by anchor proximity.
  needs: [evidence/claim_evidence_matrix.json, reviews/issue_graph.json]
  produces: [evidence/claim_evidence_matrix.json]
  command: link-issues-to-claims
  positional: [evidence/claim_evidence_matrix.json, reviews/issue_graph.json]

- id: render_claim_matrix
  description: Render evidence/claim_evidence_matrix.json to a Markdown view with linked issues.
  needs: [evidence/claim_evidence_matrix.json]
  produces: [evidence/claim_evidence_matrix.md]
  command: render-claim-matrix
  positional: [evidence/claim_evidence_matrix.json, evidence/claim_evidence_matrix.md]
  flags: ["--issue-graph=reviews/issue_graph.json"]

- id: synthesize_comments_draft
  description: Cheap pre-pass — cluster + severity-cap filter on issue_graph for use as candidate pool.
  needs: [reviews/issue_graph.json]
  produces: [comments/review_comments.draft.json]
  command: synthesize-comments
  positional: [reviews/issue_graph.json, comments/review_comments.draft.json]
  flags: ["--claim-matrix=evidence/claim_evidence_matrix.json"]

- id: detail_audit
  description: Preserve v1-style concrete technical details as checklist items so the strategic meta-review cannot compress them away.
  needs: [reviews/issue_graph.json]
  produces: [comments/detail_audit.json]
  command: detail-audit
  positional: [reviews/issue_graph.json, comments/detail_audit.json]

- id: meta_review_issues
  description: Strategic strong-model meta-review anchored on paper_shape — cross-anchor dedup, severity recalibration, revision_priority assignment, track assignment, macro re-contextualization. It should handle paper-shape-level comments, not low-level checklist retention.
  needs: [reviews/issue_graph.json, comments/review_comments.draft.json, reviews/paper_shape.md]
  produces: [reviews/meta_review.md, comments/review_comments.meta.json]
  command: meta-review-issues
  positional: [reviews/issue_graph.json, reviews/meta_review.md, comments/review_comments.meta.json]
  flags: ["--draft=comments/review_comments.draft.json", "--claim-matrix=evidence/claim_evidence_matrix.json", "--paper-shape=reviews/paper_shape.md", "--units-root=units"]

- id: compose_author_review
  description: Legacy/fallback composer (V6 era). Writes a deterministic author Markdown from paper_shape + strategic comments + detail_audit. Kept because `author_editorial_rewrite` reuses its body when no strong-model API key is available; it is no longer the canonical author deliverable. The canonical author Markdown is overwritten later by `author_editorial_rewrite`.
  needs: [reviews/paper_shape.md, comments/review_comments.meta.json, comments/detail_audit.json, provenance/source_map.jsonl]
  produces: [comments/author_review_package.json, comments/author_facing_comments.md]
  command: compose-author-review
  positional: [reviews/paper_shape.md, comments/review_comments.meta.json, comments/detail_audit.json, provenance/source_map.jsonl, comments/author_facing_comments.md]
  flags: ["--output-json=comments/author_review_package.json"]

- id: author_polish
  description: Final deterministic language cleanup for author-facing Markdown — remove process/provenance terms and normalize wording.
  needs: [comments/author_facing_comments.md]
  produces: [comments/author_facing_comments.md]
  command: author-polish
  positional: [comments/author_facing_comments.md, comments/author_facing_comments.md]

- id: methodology_adversary
  description: Strong-model adversarial methodology audit (default provider, deepseek). Reads intro + methods + results in full and emits hidden_assumptions + unmet_research_goals + headline_claim_dependencies. Plan force-merges fatal/major findings into must_keep_strategic.
  needs: [units/chapters/chapter_01.md, units/chapters/chapter_03.md, units/chapters/chapter_04.md]
  produces: [reviews/methodology_adversary.json]
  command: methodology-adversary
  positional: [units/chapters/chapter_01.md, units/chapters/chapter_03.md, units/chapters/chapter_04.md, reviews/methodology_adversary.json]
  flags: ["--case-id={case_id}", "--provider=deepseek"]

- id: methodology_adversary_secondary
  description: Optional cross-provider adversary (Claude/GPT). Manual mode by default — drop the secondary LLM response into reviews/methodology_adversary.secondary_response.txt. With --skip-if-missing, the stage writes a manual_pending stub and exits 0 when no response is present, so the workflow never blocks on a missing cross-provider input.
  needs: [units/chapters/chapter_01.md, units/chapters/chapter_03.md, units/chapters/chapter_04.md]
  produces: [reviews/methodology_adversary.secondary.json]
  command: methodology-adversary
  positional: [units/chapters/chapter_01.md, units/chapters/chapter_03.md, units/chapters/chapter_04.md, reviews/methodology_adversary.secondary.json]
  flags:
    - "--case-id={case_id}"
    - "--provider=manual"
    - "--external-input=reviews/methodology_adversary.secondary_response.txt"
    - "--prompt-cache=reviews/methodology_adversary.secondary_prompt.md"
    - "--skip-if-missing"

- id: merge_methodology_adversaries
  description: Merge primary (deepseek) + secondary (cross-provider, optional) adversary outputs. Classifies each finding as all_agree / multi_provider / single_provider_only / conflict, votes severity across sources, and surfaces a needs_human_decision list (conflicts, single-provider fatals, every claim_downgrade).
  needs: [reviews/methodology_adversary.json]
  produces: [reviews/methodology_adversary.merged.json, reviews/methodology_adversary.merged.md]
  command: merge-methodology-adversaries
  positional: [reviews/methodology_adversary.merged.json]
  flags:
    - "--input=reviews/methodology_adversary.json"
    - "--input=reviews/methodology_adversary.secondary.json"
    - "--md=reviews/methodology_adversary.merged.md"

- id: author_review_plan
  description: Editorial planning step. Decides best form, three overall revision directions, must-keep strategic comments, detail pool, demote/drop, and voice. Reads the merged methodology adversary so cross-provider fatal/major findings (and needs_human_decision flags) propagate into the plan; force-merges fatal/major into must_keep_strategic so they never silently drop.
  needs: [reviews/paper_shape.md, comments/review_comments.meta.json, comments/detail_audit.json, reviews/methodology_adversary.merged.json]
  produces: [comments/author_review_plan.json, comments/author_review_plan.md]
  command: author-review-plan
  positional: [reviews/paper_shape.md, comments/review_comments.meta.json, comments/detail_audit.json, comments/author_review_plan.json, comments/author_review_plan.md]
  flags: ["--voice=senior_peer", "--methodology-adversary=reviews/methodology_adversary.merged.json"]

- id: author_editorial_rewrite
  description: Strong-model editorial rewrite of the deliverable author-facing review. Reads paper_shape + plan + meta comments + detail audit, produces the canonical comments/author_facing_comments.md with internal-token redaction. Falls back to deterministic compose+polish offline.
  needs: [reviews/paper_shape.md, comments/author_review_plan.json, comments/review_comments.meta.json, comments/detail_audit.json, provenance/source_map.jsonl]
  produces: [comments/author_facing_comments.md]
  command: author-editorial-rewrite
  positional: [reviews/paper_shape.md, comments/author_review_plan.json, comments/review_comments.meta.json, comments/detail_audit.json, provenance/source_map.jsonl, comments/author_facing_comments.md]
  flags: ["--voice=senior_peer"]

- id: dissent
  description: Adversarial dissent. thesis_undergrad uses the intensified prompt to counter examiner default-pass.
  needs: [reviews/issue_graph.json]
  produces: [reviews/dissent.md]
  gate: human
  instruction: Write reviews/dissent.md using templates/prompts/dissent_thesis.md. Required to neutralize examiner default-pass posture (GAP-007).

- id: integrity_check
  description: Integrity, ethics, AI-disclosure, and undergraduate ghost-writing red flag check.
  needs: [normalized/manuscript.md]
  produces: [reviews/integrity_check.md]
  gate: human
  instruction: Run templates/prompts/integrity_check.md. For thesis_undergrad, training cycle completion and ghost-writing red flags are required (GAP-009).

- id: review_comments_human_edit
  description: Human reviews the canonical author Markdown (produced by author_editorial_rewrite) and optionally refines comments/review_comments.meta.json into comments/review_comments.json for the legacy structured renderer below.
  needs: [comments/author_facing_comments.md, comments/review_comments.meta.json]
  produces: [comments/review_comments.json]
  gate: human
  instruction: Review comments/author_facing_comments.md first — that is the canonical author deliverable, written by author_editorial_rewrite over the merged adversary plan. Only fill comments/review_comments.json if you need the legacy structured renderer; the author version is no longer derived from this file.

- id: render_author_comments
  description: Legacy structured-comments renderer. Writes comments/author_facing_comments.legacy.md from comments/review_comments.json. The canonical author deliverable for thesis_undergrad is comments/author_facing_comments.md, produced by author_editorial_rewrite.
  needs: [comments/review_comments.json, provenance/source_map.jsonl]
  produces: [comments/author_facing_comments.legacy.md]
  command: render-comments
  positional: [comments/review_comments.json, provenance/source_map.jsonl, comments/author_facing_comments.legacy.md]
  flags: ["--mode=author", "--paper-shape=reviews/paper_shape.md"]

- id: render_supervisor_comments
  description: Render the supervisor-internal view — full traceability with ISS/CLM provenance, both severity and priority labels, paper_shape embedded.
  needs: [comments/review_comments.json, provenance/source_map.jsonl]
  produces: [comments/supervisor_internal.md]
  command: render-comments
  positional: [comments/review_comments.json, provenance/source_map.jsonl, comments/supervisor_internal.md]
  flags: ["--mode=supervisor", "--paper-shape=reviews/paper_shape.md"]

- id: editorial_decision
  description: Final human-owned editorial judgment.
  needs: [comments/author_facing_comments.md]
  produces: [decision/editorial_judgment.md]
  gate: human
  instruction: Fill decision/editorial_judgment.md per docs/decision_record_format.md. Distinguish adopted, rejected, and unresolved AI critiques.

- id: retrospective
  description: Case retrospective for KMS upgrade routes.
  produces: [retrospective.md]
  gate: human
  instruction: Update retrospective.md with what the workflow caught, what it missed, and any candidate KMS upgrades.
